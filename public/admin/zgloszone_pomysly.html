<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homeyko - Zgłoszone pomysły</title>
    <link rel="icon" href="/favicon.ico" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="min-h-screen bg-gray-50">
    <header class="sticky top-0 z-10 flex items-center justify-between bg-[color:var(--brand-maroon-dark)] px-4 py-4 sm:px-6">
      <a href="/admin" class="inline-flex items-center">
        <img src="/images/logo-white.png" alt="Homeyko" class="h-7 w-auto" />
      </a>
      <div class="hidden items-center gap-4" id="header-user">
        <span id="whoami" class="text-sm text-white/80"></span>
        <button
          id="logout-btn"
          type="button"
          class="rounded-md border border-white/30 px-3 py-1.5 text-sm font-semibold text-white transition-colors hover:bg-white/10"
        >
          Wyloguj
        </button>
      </div>
    </header>

    <main>
      <section id="list-section" data-type="pomysl" class="mx-auto max-w-3xl px-4 py-8 sm:px-6 sm:py-10">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
          <div>
            <a href="/admin" class="mb-1 inline-block text-sm font-semibold text-gray-500 hover:text-gray-700">&larr; Dashboard</a>
            <h1 class="text-2xl font-bold text-gray-900">
              Zgłoszone pomysły
              <span id="submissions-count" class="ml-1 text-lg font-normal text-gray-400"></span>
            </h1>
          </div>
        </div>

        <div id="empty-state" class="hidden rounded-xl border border-dashed border-gray-300 py-16 text-center text-gray-400">
          Brak zgłoszeń.
        </div>

        <div id="submissions-list" class="flex flex-col gap-3"></div>
      </section>
    </main>

    <script src="/js/admin-list.js"></script>
    <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
