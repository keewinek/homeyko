<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homeyko - Administracja</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/icon-512.png" />
    <meta name="theme-color" content="#540002" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="min-h-screen bg-gray-50">
    <header class="sticky top-0 z-10 flex items-center justify-between bg-[color:var(--brand-maroon-dark)] px-4 py-4 sm:px-6">
      <a href="/admin" class="inline-flex items-center">
        <img src="/images/logo-white.png" alt="Homeyko" class="h-7 w-auto" />
      </a>
      <div class="hidden items-center gap-4" id="header-user">
        <span id="whoami" class="text-sm text-white/80"></span>
        <button
          id="logout-btn"
          type="button"
          class="rounded-md border border-white/30 px-3 py-1.5 text-sm font-semibold text-white transition-colors hover:bg-white/10"
        >
          Wyloguj
        </button>
      </div>
    </header>

    <main>
      <section class="mx-auto max-w-4xl px-4 py-8 sm:px-6 sm:py-10">
        <a href="/admin" class="mb-1 inline-block text-sm font-semibold text-gray-500 hover:text-gray-700">&larr; Dashboard</a>
        <h1 class="mb-6 text-2xl font-bold text-gray-900">Administracja</h1>

        <div class="mb-6 flex gap-1 border-b border-gray-200" role="tablist">
          <button
            type="button"
            data-tab="users"
            class="tab-btn border-b-2 border-[color:var(--brand-maroon)] px-4 py-2 text-sm font-semibold text-gray-900"
          >
            Użytkownicy sztabu
          </button>
          <button
            type="button"
            data-tab="logs"
            class="tab-btn border-b-2 border-transparent px-4 py-2 text-sm font-semibold text-gray-500 hover:text-gray-700"
          >
            Log aktywności
          </button>
        </div>

        <section id="tab-users" class="tab-panel">
          <div class="overflow-x-auto rounded-xl border border-gray-100 bg-white shadow-sm">
            <table class="w-full min-w-[640px] text-left text-sm">
              <thead>
                <tr class="border-b border-gray-100 text-xs uppercase tracking-wide text-gray-400">
                  <th class="px-4 py-3 font-semibold">Login</th>
                  <th class="px-4 py-3 font-semibold">Poziom</th>
                  <th class="px-4 py-3 font-semibold">Hasło</th>
                  <th class="px-4 py-3 font-semibold">Ostatnie logowanie</th>
                  <th class="px-4 py-3 font-semibold"><span class="sr-only">Akcje</span></th>
                </tr>
              </thead>
              <tbody id="users-table-body"></tbody>
            </table>
          </div>
          <div id="users-empty-state" class="hidden rounded-xl border border-dashed border-gray-300 py-10 text-center text-gray-400">
            Brak użytkowników.
          </div>
        </section>

        <section id="tab-logs" class="tab-panel hidden">
          <h2 class="mb-3 text-lg font-bold text-gray-900">
            Log aktywności
            <span id="logs-count" class="ml-1 text-base font-normal text-gray-400"></span>
          </h2>
          <div id="logs-empty-state" class="hidden rounded-xl border border-dashed border-gray-300 py-10 text-center text-gray-400">
            Brak zdarzeń.
          </div>
          <div id="logs-list" class="hidden flex-col gap-2"></div>
          <button
            type="button"
            id="logs-load-more-btn"
            class="mx-auto mt-6 hidden rounded-lg border border-gray-200 bg-white px-4 py-2 text-sm font-semibold text-gray-600 transition-colors hover:border-gray-300 hover:bg-gray-50"
          ></button>
        </section>
      </section>
    </main>

    <script src="/js/admin-administracja.js"></script>
    <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
