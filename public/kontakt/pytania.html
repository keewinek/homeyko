<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homeyko - Zadaj pytanie</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=Anton&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="bg-white">
    <header class="bg-[color:var(--brand-maroon-dark)] px-4 py-5">
      <a href="/" class="inline-flex items-center">
        <img src="/images/logo-white.png" alt="Homeyko" class="h-7 w-auto" />
      </a>
    </header>

    <main class="kontakt-page">
      <h1 id="kontakt-title" class="kontakt-page__title">Zadaj pytanie</h1>

      <form id="kontakt-form" class="kontakt-form" novalidate>
        <input type="hidden" id="kontakt-type" name="type" value="pytanie" />

        <!-- Honeypot: ukryte pole, ludzie go nie widzą i nie wypełniają -->
        <div class="hidden" aria-hidden="true">
          <label for="website">Zostaw puste</label>
          <input
            type="text"
            id="website"
            name="website"
            tabindex="-1"
            autocomplete="off"
          />
        </div>

        <div class="kontakt-card" id="kontakt-card">
          <label for="message" class="sr-only">Wiadomość</label>
          <textarea
            id="message"
            name="message"
            rows="4"
            required
            maxlength="2000"
            placeholder="Twoje pytanie..."
            class="kontakt-card__textarea"
          ></textarea>
        </div>

        <div class="kontakt-field">
          <label for="contact" class="kontakt-field__label">
            Kontakt (opcjonalnie)
          </label>
          <input
            type="text"
            id="contact"
            name="contact"
            placeholder="e-mail lub Instagram, jeśli chcesz odpowiedź"
            class="kontakt-field__input"
          />
        </div>

        <button type="submit" class="btn btn--primary kontakt-submit">
          Wyślij
        </button>

        <p id="kontakt-status" role="status" class="kontakt-status"></p>
      </form>

      <div class="mailbox" id="mailbox" aria-hidden="true">
        <svg class="mailbox__body" viewBox="0 0 100 90" width="76" height="68">
          <path d="M10 40 Q10 10 50 10 Q90 10 90 40 L90 85 Q90 88 87 88 L13 88 Q10 88 10 85 Z" fill="#c9302c" />
          <rect x="4" y="82" width="92" height="8" rx="4" fill="#7a1613" />
          <rect x="26" y="33" width="48" height="9" rx="4.5" fill="#5a0f0d" />
        </svg>
        <div class="mailbox__check">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M5 13l4 4L19 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <p class="mailbox__message" id="mailbox-message"></p>
      </div>
    </main>

    <script src="/js/kontakt.js"></script>
  </body>
</html>
