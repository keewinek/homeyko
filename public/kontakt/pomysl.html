<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homeyko - Zgłoś pomysł</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=Anton&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="bg-white">
    <header class="bg-[color:var(--brand-maroon-dark)] px-4 py-5">
      <a href="/" class="inline-flex items-center">
        <img src="/images/logo-white.png" alt="Homeyko" class="h-7 w-auto" />
      </a>
    </header>

    <main class="kontakt-page">
      <h1 id="kontakt-title" class="kontakt-page__title">Zgłoś pomysł</h1>

      <form id="kontakt-form" class="kontakt-form" novalidate>
        <input type="hidden" id="kontakt-type" name="type" value="pomysl" />

        <!-- Honeypot: ukryte pole, ludzie go nie widzą i nie wypełniają -->
        <div class="hidden" aria-hidden="true">
          <label for="website">Zostaw puste</label>
          <input
            type="text"
            id="website"
            name="website"
            tabindex="-1"
            autocomplete="off"
          />
        </div>

        <div class="kontakt-card" id="kontakt-card">
          <label for="message" class="sr-only">Wiadomość</label>
          <textarea
            id="message"
            name="message"
            rows="4"
            required
            minlength="5"
            maxlength="500"
            placeholder="Twój pomysł..."
            class="kontakt-card__textarea"
          ></textarea>
          <span class="kontakt-card__counter" id="kontakt-counter" aria-hidden="true"></span>
          <button type="submit" class="kontakt-send" aria-label="Wyślij" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" class="kontakt-send__icon">
              <path
                d="M5 12h13M13 6l6 6-6 6"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>

        <p id="kontakt-status" role="status" class="kontakt-status"></p>
      </form>

      <div class="mailbox" id="mailbox" aria-hidden="true">
        <svg class="mailbox__body" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="mailboxBody" x1="18" y1="12" x2="88" y2="92" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ff8f88" />
              <stop offset="0.55" stop-color="#f2564e" />
              <stop offset="1" stop-color="#d1342e" />
            </linearGradient>
            <linearGradient id="mailboxBase" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e0433c" />
              <stop offset="1" stop-color="#b52a25" />
            </linearGradient>
          </defs>

          <ellipse cx="50" cy="94" rx="34" ry="5" fill="#2e0001" opacity="0.18" />
          <rect x="10" y="82" width="80" height="10" rx="5" fill="url(#mailboxBase)" />
          <path
            d="M14 46 Q14 12 50 12 Q86 12 86 46 L86 82 L14 82 Z"
            fill="url(#mailboxBody)"
          />

          <rect x="28" y="40" width="44" height="10" rx="5" fill="#7a1613" />
          <rect x="28" y="40" width="44" height="3" rx="1.5" fill="#4a0b09" opacity="0.7" />
          <rect x="28" y="48" width="44" height="2.5" rx="1.25" fill="#ff9c96" opacity="0.5" />
        </svg>
      </div>

      <div class="mailbox-result" id="mailbox-result" aria-hidden="true">
        <div class="mailbox__check mailbox__check--heart">
          <svg viewBox="0 0 24 24" width="52" height="52" aria-hidden="true">
            <defs>
              <linearGradient id="heartGrad" x1="4" y1="3" x2="20" y2="21" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#ff8f88" />
                <stop offset="0.55" stop-color="#f2564e" />
                <stop offset="1" stop-color="#d1342e" />
              </linearGradient>
            </defs>
            <path
              d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41 0.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
              fill="url(#heartGrad)"
            />
            <ellipse cx="8.3" cy="7.6" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.4" transform="rotate(-28 8.3 7.6)" />
          </svg>
        </div>
        <div class="mailbox__check mailbox__check--limited">
          <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="#540002" stroke-width="3" stroke-linecap="round" />
          </svg>
        </div>
        <p class="mailbox__message" id="mailbox-message"></p>
      </div>
    </main>

    <script src="/js/kontakt.js"></script>
  </body>
</html>
