  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/icon-512.png" />
    <meta name="theme-color" content="#540002" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Homeyko" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:url" content="https://homeyko.pl/" />
    <meta property="og:title" content="Homeyko - Już wkrótce" />
    <meta property="og:description" content="Już wkrótce." />
    <meta property="og:image" content="https://homeyko.pl/images/og-image.png" />
    <meta property="og:image:type" content="image/png" />

    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <section class="countdown-gate" aria-label="Odliczanie do uruchomienia strony">
      <div class="countdown-gate__inner">
        <img src="/images/logo-white.png" alt="Homeyko" class="countdown-gate__logo" />

        <div id="cd-live" class="countdown-gate__timer">
          <div class="countdown-gate__unit">
            <span id="cd-hours" class="countdown-gate__value">00</span>
            <span class="countdown-gate__label">godz.</span>
          </div>
          <div class="countdown-gate__unit">
            <span id="cd-minutes" class="countdown-gate__value">00</span>
            <span class="countdown-gate__label">min.</span>
          </div>
          <div class="countdown-gate__unit">
            <span id="cd-seconds" class="countdown-gate__value">00</span>
            <span class="countdown-gate__label">sek.</span>
          </div>
        </div>

        <p id="cd-done" hidden class="countdown-gate__done">
          Kampania właśnie się rozpoczęła! Strona zaraz się odświeży.
        </p>

        <noscript>
          <p class="countdown-gate__noscript">Start kampanii: 23 września, o północy.</p>
        </noscript>
      </div>
    </section>

    <script src="/js/countdown.js"></script>
    <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
