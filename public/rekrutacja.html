  </head>
  <body class="min-h-screen bg-white">
    <header class="bg-[color:var(--brand-maroon-dark)] py-5 px-[clamp(1.25rem,4vw,3rem)]">
      <a href="/" class="inline-flex items-center">
        <img src="/images/logo-white.png" alt="Homeyko" class="h-7 w-auto" />
      </a>
    </header>

    <main class="mx-auto flex max-w-lg flex-col px-4 py-8 sm:py-10">
      <h1 class="mb-6 font-[family-name:var(--font-display)] text-2xl font-black uppercase leading-tight text-[color:var(--brand-maroon)] sm:text-[1.7rem]">Chcę działać w samorządzie</h1>

        <form id="rekrutacja-form" class="flex flex-col gap-4" novalidate>
          <div class="hidden" aria-hidden="true">
            <label for="website">Zostaw puste</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="firstName" class="mb-1 block text-xs font-bold uppercase tracking-wide text-gray-500">Imię</label>
              <input type="text" id="firstName" name="firstName" required minlength="2" maxlength="40" autocomplete="given-name" class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 outline-none transition focus:border-[color:var(--brand-maroon)] focus:ring-2 focus:ring-[color:var(--brand-coral)]/30" />
            </div>
            <div>
              <label for="lastName" class="mb-1 block text-xs font-bold uppercase tracking-wide text-gray-500">Nazwisko</label>
              <input type="text" id="lastName" name="lastName" required minlength="2" maxlength="40" autocomplete="family-name" class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 outline-none transition focus:border-[color:var(--brand-maroon)] focus:ring-2 focus:ring-[color:var(--brand-coral)]/30" />
            </div>
          </div>

          <div>
            <label for="className" class="mb-1 block text-xs font-bold uppercase tracking-wide text-gray-500">Klasa</label>
            <input type="text" id="className" name="className" required maxlength="10" placeholder="np. 2B" autocomplete="off" class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 outline-none transition focus:border-[color:var(--brand-maroon)] focus:ring-2 focus:ring-[color:var(--brand-coral)]/30 max-w-[8rem]" />
          </div>

          <div>
            <label for="contact" class="mb-1 block text-xs font-bold uppercase tracking-wide text-gray-500">Zostaw kontakt do siebie np. Instagram</label>
            <input type="text" id="contact" name="contact" required minlength="3" maxlength="100" autocomplete="off" class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 outline-none transition focus:border-[color:var(--brand-maroon)] focus:ring-2 focus:ring-[color:var(--brand-coral)]/30" />
          </div>

          <div>
            <label for="motivation" class="mb-1 block text-xs font-bold uppercase tracking-wide text-gray-500">Dlaczego chcesz być członkiem samorządu?</label>
            <textarea id="motivation" name="motivation" rows="4" required minlength="10" maxlength="1000" class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 outline-none transition focus:border-[color:var(--brand-maroon)] focus:ring-2 focus:ring-[color:var(--brand-coral)]/30 resize-none"></textarea>
            <p id="motivation-counter" class="mt-1 text-right text-[11px] leading-none text-gray-400" aria-hidden="true"></p>
          </div>

          <p id="rekrutacja-status" role="status" class="text-sm font-semibold empty:hidden"></p>

          <button type="submit" id="rekrutacja-submit"
            class="inline-flex items-center justify-center rounded-md bg-[color:var(--brand-coral)] px-5 py-2.5 text-sm font-bold text-white transition-colors hover:bg-[color:var(--brand-maroon)] disabled:cursor-not-allowed disabled:opacity-50">
            Wyślij zgłoszenie
          </button>
        </form>

        <div id="rekrutacja-thanks" class="hidden py-6" role="status">
          <h2 class="text-xl font-black text-[color:var(--brand-maroon)]">Dziękujemy za zgłoszenie!</h2>
          <p class="mt-1 text-sm text-gray-600">Odezwiemy się do wybranych osób.</p>
          <a href="/" class="mt-5 inline-block text-sm font-semibold text-[color:var(--brand-maroon)] underline underline-offset-4">Wróć na stronę główną</a>
        </div>
    </main>

    <script src="/js/rekrutacja.js"></script>
