<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homeyko — Panel admina</title>
    <link rel="icon" href="/favicon.ico" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="bg-gray-50">
    <header class="flex items-center justify-between bg-[color:var(--brand-maroon-dark)] px-4 py-4">
      <a href="/" class="inline-flex items-center">
        <img src="/images/logo-white.png" alt="Homeyko" class="h-7 w-auto" />
      </a>
      <button
        id="logout-btn"
        type="button"
        class="hidden text-sm font-semibold text-white underline"
      >
        Wyloguj
      </button>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-10">
      <section id="login-section" class="mx-auto max-w-sm">
        <h1 class="mb-6 text-center text-2xl font-bold text-gray-900">
          Logowanie
        </h1>
        <form id="login-form" class="flex flex-col gap-3">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Hasło"
            required
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-[color:var(--brand-maroon)] focus:outline-none"
          />
          <button type="submit" class="btn btn--primary justify-center">
            Zaloguj
          </button>
          <p id="login-status" role="status" class="text-center text-sm text-red-600"></p>
        </form>
      </section>

      <section id="submissions-section" class="hidden">
        <h1 class="mb-6 text-2xl font-bold text-gray-900">Zgłoszenia</h1>
        <p id="empty-state" class="hidden text-gray-500">Brak zgłoszeń.</p>
        <div id="submissions-list" class="flex flex-col gap-4"></div>
      </section>
    </main>

    <script src="/js/admin.js"></script>
  </body>
</html>
