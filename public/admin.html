<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homeyko - Panel admina</title>
    <link rel="icon" href="/favicon.ico" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="min-h-screen bg-gray-50">
    <header class="sticky top-0 z-10 flex items-center justify-between bg-[color:var(--brand-maroon-dark)] px-4 py-4 sm:px-6">
      <a href="/" class="inline-flex items-center">
        <img src="/images/logo-white.png" alt="Homeyko" class="h-7 w-auto" />
      </a>
      <div class="hidden items-center gap-4" id="header-user">
        <span id="whoami" class="text-sm text-white/80"></span>
        <button
          id="logout-btn"
          type="button"
          class="rounded-md border border-white/30 px-3 py-1.5 text-sm font-semibold text-white transition-colors hover:bg-white/10"
        >
          Wyloguj
        </button>
      </div>
    </header>

    <main>
      <section
        id="login-section"
        class="flex min-h-[calc(100vh-64px)] items-center justify-center px-4 py-12"
      >
        <div class="w-full max-w-sm rounded-2xl border border-gray-100 bg-white p-8 shadow-lg">
          <svg
            viewBox="0 0 100 100"
            class="mx-auto mb-4 h-10 w-10"
            aria-hidden="true"
          >
            <path
              d="M19 13 Q10 14 10 23 L8 76 Q8 87 19 88 L79 90 Q90 90 91 79 L93 22 Q93 11 82 12 Z"
              fill="none"
              stroke="var(--brand-maroon)"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M26 27 Q50 53 74 76"
              fill="none"
              stroke="var(--brand-maroon)"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M75 26 Q49 52 25 75"
              fill="none"
              stroke="var(--brand-maroon)"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <h1 class="mb-2 text-center text-2xl font-bold text-gray-900">
            Panel sztabu
          </h1>
          <p class="mb-6 text-center text-sm text-gray-500">
            Pierwsze logowanie na Twój login samo ustawi podane hasło jako
            docelowe. Zapamiętaj je.
          </p>
          <form id="login-form" class="flex flex-col gap-3">
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Login"
              required
              autocomplete="username"
              class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-900 focus:border-[color:var(--brand-maroon)] focus:outline-none focus:ring-1 focus:ring-[color:var(--brand-maroon)]"
            />
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Hasło (min. 8 znaków)"
              required
              minlength="8"
              autocomplete="current-password"
              class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-900 focus:border-[color:var(--brand-maroon)] focus:outline-none focus:ring-1 focus:ring-[color:var(--brand-maroon)]"
            />
            <button
              type="submit"
              class="mt-1 w-full rounded-lg bg-[color:var(--brand-coral)] py-2.5 font-bold text-[color:var(--brand-maroon-dark)] transition-transform hover:-translate-y-0.5"
            >
              Zaloguj
            </button>
            <p id="login-status" role="status" class="text-center text-sm text-red-600"></p>
          </form>
        </div>
      </section>

      <section id="submissions-section" class="mx-auto hidden max-w-3xl px-4 py-8 sm:px-6 sm:py-10">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
          <h1 class="text-2xl font-bold text-gray-900">
            Zgłoszenia
            <span id="submissions-count" class="ml-1 text-lg font-normal text-gray-400"></span>
          </h1>
          <div id="filter-tabs" class="flex gap-1.5 rounded-lg bg-gray-200/70 p-1">
            <button type="button" data-filter="all" class="filter-tab rounded-md px-3 py-1.5 text-sm font-semibold">
              Wszystkie
            </button>
            <button type="button" data-filter="pomysl" class="filter-tab rounded-md px-3 py-1.5 text-sm font-semibold">
              Pomysły
            </button>
            <button type="button" data-filter="pytanie" class="filter-tab rounded-md px-3 py-1.5 text-sm font-semibold">
              Pytania
            </button>
          </div>
        </div>

        <div id="empty-state" class="hidden rounded-xl border border-dashed border-gray-300 py-16 text-center text-gray-400">
          Brak zgłoszeń w tej kategorii.
        </div>

        <div id="submissions-list" class="flex flex-col gap-3"></div>
      </section>
    </main>

    <script src="/js/admin.js"></script>
    <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
