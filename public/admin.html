<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homeyko - Panel admina</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/icon-512.png" />
    <meta name="theme-color" content="#540002" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="min-h-screen bg-gray-50">
    <header class="sticky top-0 z-10 flex items-center justify-between bg-[color:var(--brand-maroon-dark)] px-4 py-4 sm:px-6">
      <a href="/" class="inline-flex items-center">
        <img src="/images/logo-white.png" alt="Homeyko" class="h-7 w-auto" />
      </a>
      <div class="hidden items-center gap-4" id="header-user">
        <span id="whoami" class="text-sm text-white/80"></span>
        <button
          id="logout-btn"
          type="button"
          class="rounded-md border border-white/30 px-3 py-1.5 text-sm font-semibold text-white transition-colors hover:bg-white/10"
        >
          Wyloguj
        </button>
      </div>
    </header>

    <main>
      <section
        id="boot-spinner"
        class="flex min-h-[calc(100vh-64px)] items-center justify-center px-4 py-12"
      >
        <div class="h-10 w-10 animate-spin rounded-full border-4 border-gray-200 border-t-[color:var(--brand-maroon)]"></div>
      </section>

      <section
        id="login-section"
        class="hidden min-h-[calc(100vh-64px)] items-center justify-center px-4 py-12"
      >
        <div id="login-card" class="w-full max-w-sm rounded-2xl border border-gray-100 bg-white p-8 shadow-lg">
          <h1 class="mb-2 text-center text-2xl font-bold text-gray-900">
            Panel sztabu
          </h1>
          <p class="mb-6 text-center text-sm text-gray-500">
            Pierwsze logowanie na Twój login samo ustawi podane hasło jako
            docelowe. Zapamiętaj je.
          </p>
          <form id="login-form" class="flex flex-col gap-3">
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Login"
              required
              autocomplete="username"
              class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-900 focus:border-[color:var(--brand-maroon)] focus:outline-none focus:ring-1 focus:ring-[color:var(--brand-maroon)]"
            />
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Hasło (min. 8 znaków)"
              required
              minlength="8"
              autocomplete="current-password"
              class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-900 focus:border-[color:var(--brand-maroon)] focus:outline-none focus:ring-1 focus:ring-[color:var(--brand-maroon)]"
            />
            <button
              type="submit"
              class="mt-1 w-full rounded-lg bg-[color:var(--brand-coral)] py-2.5 font-bold text-[color:var(--brand-maroon-dark)] transition-transform hover:-translate-y-0.5"
            >
              Zaloguj
            </button>
            <p id="login-status" role="status" class="text-center text-sm text-red-600"></p>
          </form>
        </div>
        <div id="login-spinner" class="hidden" role="status" aria-live="polite">
          <div
            class="mx-auto h-10 w-10 animate-spin rounded-full border-4 border-gray-200 border-t-[color:var(--brand-maroon)]"
          ></div>
        </div>
      </section>

      <section id="dashboard-section" class="mx-auto hidden max-w-3xl px-4 py-8 sm:px-6 sm:py-10">
        <h1 class="mb-6 text-2xl font-bold text-gray-900">Dashboard</h1>
        <div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
          <a
            href="/admin/zgloszone_pomysly"
            class="flex aspect-square flex-col items-center justify-center gap-3 rounded-2xl border border-gray-100 bg-white p-4 text-center shadow-sm transition-transform hover:-translate-y-0.5 hover:shadow-md"
          >
            <svg viewBox="0 0 24 24" class="h-9 w-9" fill="none" stroke="var(--brand-maroon)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 18h6" />
              <path d="M10 22h4" />
              <path d="M12 2a7 7 0 0 0-4 12.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26A7 7 0 0 0 12 2Z" />
            </svg>
            <span class="text-sm font-semibold text-gray-900">Zgłoszone pomysły</span>
          </a>
          <a
            href="/admin/zgloszone_pytania"
            class="flex aspect-square flex-col items-center justify-center gap-3 rounded-2xl border border-gray-100 bg-white p-4 text-center shadow-sm transition-transform hover:-translate-y-0.5 hover:shadow-md"
          >
            <svg viewBox="0 0 24 24" class="h-9 w-9" fill="none" stroke="var(--brand-maroon)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10" />
              <path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.33c-.77.32-1.4.99-1.4 1.92v.25" />
              <path d="M12 17h.01" />
            </svg>
            <span class="text-sm font-semibold text-gray-900">Zgłoszone pytania</span>
          </a>
        </div>
      </section>
    </main>

    <script src="/js/admin.js"></script>
    <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
